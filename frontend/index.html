<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div id="root"></div>

  <!-- React + ReactDOM (development builds — good errors in console) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel Standalone: compiles JSX in the browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Our app files (order matters — dependencies first) -->
  <script type="text/babel" src="./js/api.js"></script>
  <script type="text/babel" src="./js/auth.js"></script>
  <script type="text/babel" src="./js/tasks.js"></script>
  <script type="text/babel" src="./js/app.js"></script>
</body>
</html>
