services:
  - type: web
    name: task-manager
    runtime: node
    plan: free
    region: frankfurt   # closest to Syria; change if you prefer
    branch: main
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        sync: false   # paste in Render dashboard
      - key: CORS_ORIGINS
        sync: false   # leave empty unless using a custom domain